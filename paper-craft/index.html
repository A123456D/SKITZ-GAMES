<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="theme-color" content="#0e0c0e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="application-name" content="PAPER CRAFT" />
    <meta name="apple-mobile-web-app-title" content="PAPER CRAFT" />
    <meta
      name="description"
      content="Fold. Stack. Rip. Street-occult sticker lane battler."
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png" />
    <link rel="apple-touch-icon" href="./icon-512.png" />
    <title>PAPER CRAFT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="stage" width="720" height="1280"></canvas>
      <div id="hud" aria-live="polite">
        <header id="topbar">
          <div id="brand"><img src="./assets/ui/logo.png" alt="PAPER CRAFT" class="brand-logo" /></div>
          <div id="status"></div>
        </header>
        <div id="toast" hidden></div>
        <div id="lanes" aria-label="Lanes">
          <button type="button" class="lane-hit" data-lane="0" aria-label="Lane 1">
            <span class="lane-tag">I</span>
          </button>
          <button type="button" class="lane-hit" data-lane="1" aria-label="Lane 2">
            <span class="lane-tag">II</span>
          </button>
          <button type="button" class="lane-hit" data-lane="2" aria-label="Lane 3">
            <span class="lane-tag">III</span>
          </button>
        </div>
        <div id="hand-area" hidden>
          <div id="hand" class="hand-fan"></div>
          <img class="hand-grip-mask" src="./assets/ui/hand-grip-mask.png" alt="" draggable="false" />
        </div>
        <div id="drag-layer" hidden>
          <div id="drag-ghost">
            <img id="drag-card" alt="" draggable="false" />
            <img id="drag-hand" src="./assets/ui/hand-hold.png" alt="" draggable="false" />
          </div>
        </div>
        <div id="actions">
          <button type="button" id="btn-fold" disabled>Fold</button>
          <button type="button" id="btn-rip" disabled>Rip</button>
          <button type="button" id="btn-pass" disabled>Pass</button>
        </div>
        <div id="menu" class="panel sheet">
          <div class="shard shard-l" aria-hidden="true"></div>
          <div class="shard shard-r" aria-hidden="true"></div>
          <img class="menu-logo" src="./assets/ui/logo.png" alt="PAPER CRAFT" />
          <div class="stickers" aria-hidden="true">
            <img src="./assets/cards/cutout_cat-front.png" alt="" />
            <img src="./assets/cards/fold_fox-front.png" alt="" />
            <img src="./assets/cards/rip_raven-front.png" alt="" />
          </div>
          <p class="tag">FOLD. STACK. RIP.</p>
          <p class="blurb">Street-occult sticker battler. One action a turn. Win the lanes.</p>
          <p class="blurb keys">
            STING scars on play or fold · FLASH draws on fold · BRACE ignores scars · GLUE blocks peel
          </p>
          <button type="button" id="btn-play">Play</button>
          <button type="button" id="btn-tutorial">Tutorial</button>
        </div>
        <div id="end" class="panel sheet" hidden>
          <div class="shard shard-l" aria-hidden="true"></div>
          <div class="shard shard-r" aria-hidden="true"></div>
          <h2 id="end-title">You win</h2>
          <p id="end-detail"></p>
          <button type="button" id="btn-again">Rematch</button>
          <button type="button" id="btn-menu">Menu</button>
        </div>
        <div id="unsupported" class="panel" hidden>
          <h2>WebGL2 required</h2>
          <p>Paper Craft needs GPU rendering. This browser or device cannot run WebGL2.</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
