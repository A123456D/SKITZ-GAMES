<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Click Clack 1.1 — UI preview</title>
<style>
  :root { --paper:#f3eee4; --ink:#161310; --red:#e0312e; --blue:#1e5bb8; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 1.25rem;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    background: linear-gradient(160deg,#f7f2e8,#f3eee4 50%,#e8e0d2);
    color: var(--ink);
  }
  h1 { font-family: Impact, "Archivo Black", sans-serif; font-size: clamp(2rem,8vw,3.5rem); margin: 0 0 .35rem; text-transform: uppercase; letter-spacing: -0.03em; }
  h1 span:first-child { color: var(--red); }
  h1 span:last-child { color: var(--blue); }
  p { max-width: 36rem; line-height: 1.45; color: #6e665c; }
  .grid { display: grid; gap: 1.25rem; margin-top: 1.25rem; }
  @media (min-width: 800px) { .grid { grid-template-columns: 1fr 1fr; } }
  figure {
    margin: 0; padding: .55rem; background: #fff; border: 3px solid var(--ink);
    box-shadow: 8px 9px 0 var(--blue);
  }
  figure:nth-child(2) { box-shadow: 8px 9px 0 var(--red); }
  img { width: 100%; height: auto; display: block; }
  figcaption { margin-top: .55rem; font-weight: 700; text-transform: uppercase; font-size: .85rem; }
  a.btn {
    display: inline-block; margin-top: 1rem; padding: .85rem 1.2rem;
    border: 3px solid var(--ink); background: #fffef9; color: var(--ink);
    text-decoration: none; font-family: Impact, sans-serif; text-transform: uppercase;
    box-shadow: 5px 5px 0 var(--red);
  }
</style>
</head>
<body>
  <h1><span>Click</span> <span>Clack</span> 1.1</h1>
  <p>This is what the Android app should look like after installing version <strong>1.1.0</strong>. If your phone still says “KEYBOARD” / “Connect first”, uninstall the old app, then download the APK again.</p>
  <a class="btn" href="/apps/click-clack/downloads/click-clack.apk" download>Download APK 1.1</a>
  <div class="grid">
    <figure>
      <img src="./connect.png" alt="Connect screen preview" width="720" height="1280" />
      <figcaption>Connect tab</figcaption>
    </figure>
    <figure>
      <img src="./keys.png" alt="Keys screen preview" width="720" height="1280" />
      <figcaption>Keys tab</figcaption>
    </figure>
  </div>
</body>
</html>
