<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Click Clack — get the Android app</title>
		<meta
			name="description"
			content="Click Clack is an Android Bluetooth mouse & keyboard remote. Download the free APK from SKITZ."
		/>
		<meta http-equiv="refresh" content="0;url=/apps/click-clack/#install" />
		<link rel="canonical" href="/apps/click-clack/" />
		<style>
			:root {
				color-scheme: dark;
				--ink: #1a1714;
				--paper: #f4efe6;
				--red: #e23d28;
				--blue: #2f6fed;
				--yellow: #e8a317;
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				padding: 1.5rem;
				font-family: 'IBM Plex Mono', ui-monospace, monospace;
				background:
					radial-gradient(circle at 12% 18%, rgba(226, 61, 40, 0.18), transparent 42%),
					radial-gradient(circle at 88% 12%, rgba(47, 111, 237, 0.16), transparent 40%),
					linear-gradient(160deg, #14110f, #221c18 55%, #1a1714);
				color: var(--paper);
			}
			.card {
				max-width: 28rem;
				padding: 1.5rem 1.35rem;
				border: 3px solid var(--paper);
				background: rgba(255, 254, 249, 0.06);
				box-shadow: 8px 8px 0 var(--yellow);
			}
			h1 {
				margin: 0 0 0.5rem;
				font-family: 'Archivo Black', Impact, sans-serif;
				font-size: clamp(2rem, 8vw, 2.8rem);
				letter-spacing: -0.03em;
			}
			p {
				margin: 0 0 1rem;
				line-height: 1.45;
				color: rgba(244, 239, 230, 0.78);
			}
			a {
				display: inline-block;
				padding: 0.7rem 1rem;
				border: 2px solid var(--paper);
				background: var(--paper);
				color: var(--ink);
				text-decoration: none;
				font-weight: 700;
			}
			a:hover {
				background: var(--red);
				border-color: var(--red);
				color: #fff;
			}
		</style>
	</head>
	<body>
		<main class="card">
			<h1>CLICK CLACK</h1>
			<p>
				The browser tester is gone. Click Clack is an Android Bluetooth remote — your phone becomes a
				mouse and keyboard for the PC.
			</p>
			<p>
				<a href="/apps/click-clack/#install">Get the Android APK</a>
			</p>
		</main>
	</body>
</html>
