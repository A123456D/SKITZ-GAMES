<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Skitz Controller — get the Android app</title>
		<meta
			name="description"
			content="Skitz Controller is an Android Bluetooth mouse & keyboard remote. Download the free APK from SKITZ."
		/>
		<meta http-equiv="refresh" content="0;url=/apps/click-clack/#install" />
		<link rel="canonical" href="/apps/click-clack/" />
		<style>
			:root {
				color-scheme: light;
				--ink: #0b1220;
				--paper: #f2f4f7;
				--accent: #2f6fed;
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				padding: 1.5rem;
				font-family: 'Manrope', system-ui, sans-serif;
				background: var(--paper);
				color: var(--ink);
			}
			.card {
				max-width: 28rem;
				padding: 1.5rem 1.35rem;
				border: 1px solid #d5dae2;
				border-radius: 16px;
				background: #fff;
			}
			h1 {
				margin: 0 0 0.5rem;
				font-size: clamp(1.8rem, 6vw, 2.4rem);
				letter-spacing: -0.03em;
				font-weight: 600;
			}
			p {
				margin: 0 0 1rem;
				line-height: 1.45;
				color: #6b7285;
			}
			a {
				display: inline-block;
				padding: 0.7rem 1rem;
				border-radius: 12px;
				background: var(--ink);
				color: #fff;
				text-decoration: none;
				font-weight: 600;
			}
		</style>
	</head>
	<body>
		<main class="card">
			<h1>Skitz Controller</h1>
			<p>
				Android Bluetooth remote — your phone becomes a mouse and keyboard for the PC.
			</p>
			<p>
				<a href="/apps/click-clack/#install">Get the Android APK</a>
			</p>
		</main>
	</body>
</html>
