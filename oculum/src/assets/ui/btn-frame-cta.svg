<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 96" fill="none" preserveAspectRatio="none">
  <!-- Ornate OCULUM CTA frame  stretchable; transparent center -->
  <defs>
    <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0d78a"/>
      <stop offset="45%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8a6a1e"/>
    </linearGradient>
    <linearGradient id="gGoldSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8a6a1e"/>
      <stop offset="50%" stop-color="#f0d78a"/>
      <stop offset="100%" stop-color="#8a6a1e"/>
    </linearGradient>
    <radialGradient id="gEye" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="55%" stop-color="#3ecfc0"/>
      <stop offset="100%" stop-color="#1a5c58"/>
    </radialGradient>
  </defs>
  <!-- Outer rim -->
  <rect x="2.5" y="2.5" width="315" height="91" rx="10" stroke="url(#gGold)" stroke-width="2.2" opacity="0.95"/>
  <rect x="6.5" y="6.5" width="307" height="83" rx="8" stroke="#f0d78a" stroke-width="0.75" opacity="0.45"/>
  <rect x="9.5" y="9.5" width="301" height="77" rx="6.5" stroke="#3a2a12" stroke-width="1.1" opacity="0.55"/>
  <!-- Filigree top rail -->
  <path d="M28 8.5 C48 3.5, 72 12, 96 7.5 S140 3, 160 8.5 S200 14, 224 7.5 S272 3.5, 292 8.5"
        stroke="url(#gGoldSide)" stroke-width="1.15" opacity="0.85"/>
  <path d="M28 87.5 C48 92.5, 72 84, 96 88.5 S140 93, 160 87.5 S200 82, 224 88.5 S272 92.5, 292 87.5"
        stroke="url(#gGoldSide)" stroke-width="1.15" opacity="0.75"/>
  <!-- Corner brackets -->
  <path d="M12 22 V14 H20" stroke="#f0d78a" stroke-width="1.4" stroke-linecap="round" opacity="0.9"/>
  <path d="M308 22 V14 H300" stroke="#f0d78a" stroke-width="1.4" stroke-linecap="round" opacity="0.9"/>
  <path d="M12 74 V82 H20" stroke="#f0d78a" stroke-width="1.4" stroke-linecap="round" opacity="0.9"/>
  <path d="M308 74 V82 H300" stroke="#f0d78a" stroke-width="1.4" stroke-linecap="round" opacity="0.9"/>
  <!-- Corner eye seals -->
  <g opacity="0.95">
    <circle cx="18" cy="18" r="5.2" fill="#1a1220" stroke="url(#gGold)" stroke-width="1.1"/>
    <circle cx="18" cy="18" r="2.4" fill="url(#gEye)"/>
    <circle cx="18.6" cy="17.4" r="0.7" fill="#e8fff8" opacity="0.85"/>
  </g>
  <g opacity="0.95">
    <circle cx="302" cy="18" r="5.2" fill="#1a1220" stroke="url(#gGold)" stroke-width="1.1"/>
    <circle cx="302" cy="18" r="2.4" fill="url(#gEye)"/>
    <circle cx="302.6" cy="17.4" r="0.7" fill="#e8fff8" opacity="0.85"/>
  </g>
  <g opacity="0.85">
    <circle cx="18" cy="78" r="4.4" fill="#1a1220" stroke="url(#gGold)" stroke-width="1"/>
    <circle cx="18" cy="78" r="2" fill="url(#gEye)"/>
  </g>
  <g opacity="0.85">
    <circle cx="302" cy="78" r="4.4" fill="#1a1220" stroke="url(#gGold)" stroke-width="1"/>
    <circle cx="302" cy="78" r="2" fill="url(#gEye)"/>
  </g>
  <!-- Center top diamond spike -->
  <path d="M160 3 L166 10 L160 14 L154 10 Z" fill="url(#gGold)" opacity="0.9"/>
</svg>
